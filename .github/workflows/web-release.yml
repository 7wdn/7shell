name: Web release (backfill)

# Attaches the browser package for a tag that was published before the release workflow built it
# itself. A normal release no longer needs this: pressing the tag is the whole trigger, and the
# browser package is one of the artifacts it publishes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the package to (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: web-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/web-package.yml
    with:
      tag: ${{ inputs.tag }}

  attach:
    name: Attach the package to the release
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-linux-x86_64
          path: web

      - name: Upload it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ls -l web
          gh release upload "$TAG" web/*-web.tar.gz --clobber