# The baseline lab: a real sshd for SSH, and a real telnetd for the console transport.
#
# Bound to loopback only. The credentials are deliberately trivial and are the ones the live tests
# expect; this is a fixture, not a deployment.
services:
  sshd:
    # The same image as `lscr.io/linuxserver/openssh-server`, taken from Docker Hub because the
    # lscr.io registry is not reachable from every network. Pin the digest when the lab has to be
    # byte-for-byte reproducible.
    image: linuxserver/openssh-server:latest
    container_name: sevenshell-lab-sshd
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: labuser
      USER_PASSWORD: labpassword
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
      # The container runtime the SSH live tests drive. A sibling daemon rather than this host's
      # engine: a Linux container cannot reach a Windows named pipe, and a test that needs the host
      # engine is a test that cannot run on CI.
      DOCKER_HOST: tcp://docker:2375
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      # The image turns port forwarding off; a lab that cannot forward cannot test a jump host or
      # a tunnel, so the setting is turned back on here rather than by editing the container.
      - ./sshd_config.d:/config/sshd/sshd_config.d:ro
      # The fixtures a test needs beyond the container itself. Same reasoning as the line above: a
      # test that has to build its own fifty thousand files is testing the building.
      - ./init.d:/custom-cont-init.d:ro
    # Keep it around between test runs; `make lab-down` removes it when it is not wanted.
    restart: unless-stopped

  # The container runtime the SSH live tests drive. `docker:dind` is the engine; the sshd container
  # gets the CLI from init.d and reaches this daemon over the compose network. No host port: only
  # the lab needs it, and publishing another port on Windows is another reserved-range accident.
  docker:
    image: docker:dind
    container_name: sevenshell-lab-docker
    privileged: true
    environment:
      # No TLS between the two lab containers: the network is compose-internal and the alternative
      # is shipping certificates into a fixture.
      DOCKER_TLS_CERTDIR: ""
    restart: unless-stopped

  # A Telnet console, so the transport is proven against a server that negotiates options rather
  # than only against the in-process one. Busybox telnetd daemonizes, so a quiet tail keeps the
  # container alive; the shell is the login program, which is all a loopback fixture needs.
  #
  # The host port is 23230 rather than 23: on Windows this machine reserves 1779-2978 for Hyper-V,
  # and a lab that cannot bind is a lab nobody can run.
  telnetd:
    image: alpine:3.20
    container_name: sevenshell-lab-telnetd
    command:
      - /bin/sh
      - -c
      - apk add --no-cache busybox-extras >/dev/null && telnetd -l /bin/sh; exec tail -f /dev/null
    ports:
      - "127.0.0.1:23230:23"
    restart: unless-stopped
