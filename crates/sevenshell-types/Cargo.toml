[package]
name = "sevenshell-types"
description = "Wire types shared with the interface, plus the descriptor tables generated from descriptors/."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
