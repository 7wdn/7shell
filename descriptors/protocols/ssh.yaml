schemaVersion: 1
order: 10
id: ssh
rustVariant: Ssh
labelKey: protocol.ssh.label
defaultPort: 22
runtime: native
transport: tcp
supportLevel: operate
# Only what this build actually does. A capability is added by the change that implements and
# tests it, so this list is the honest answer to "what can 7Shell do over SSH today?": a shell,
# resized when the window changes, kept alive while idle, reachable through another session, and
# able to answer a local port from the far side.
capabilities:
  - shell
  - exec
  - resize
  - keepalive
  - sftp
  - forwarding
  - jumpHost
