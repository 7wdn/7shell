schemaVersion: 1
order: 20
id: rdp
rustVariant: Rdp
labelKey: protocol.rdp.label
defaultPort: 3389
# The session is carried by the Windows Remote Desktop client, not by code in this process: the
# shell writes a temporary .rdp file and starts mstsc. That is why the runtime is `external` and why
# this protocol is offered on Windows only (the interface filters it, and the core refuses
# elsewhere). Clipboard, local drives and the certificate warning belong to that client.
runtime: external
transport: tcp
supportLevel: connect
capabilities:
  - systemClient
