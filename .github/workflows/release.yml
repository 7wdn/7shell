name: Release

# Everything that turns a tag into something a person can install.
#
# The tag is the whole decision: the version is bumped on `main`, the changelog section is written, and
# the tag is pushed. Verifying that the three agree is the first job and the only reason it exists —
# a release whose notes were never written, or whose tag disagrees with the version in the manifests,
# is a release that cannot be repaired after the fact.
#
# A version is numbers and periods only. A candidate is not a version with a suffix but this release
# marked as one: the artefacts are attached to a draft, the draft is published as a prerelease, and a
# person promotes it once they are satisfied — which is also when the update channel starts offering
# it. Two reasons for that order rather than a `-rc.N` suffix: an MSI carries at most a numeric
# pre-release identifier, so a suffixed version cannot be built as an installer at all, and the
# package managers carry releases rather than candidates.
#
# Nothing here builds from a working tree: every artefact comes from the tagged commit, on the
# platform it is for, because an installer built anywhere else is an installer nobody can reproduce.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, or to promote when `promote` is set (for example v0.1.0)"
        required: true
      promote:
        description: "Publish an existing prerelease as the latest release, and point the update channel at it. Nothing is built."
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: The tag, the version and the notes agree
    # Promoting builds nothing: it is a decision about a release that already exists, and running six
    # builds to make it would be six builds whose artefacts nobody would look at again.
    if: ${{ !inputs.promote }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag names the version every manifest carries
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./version.json').app")"
          if [ "v$version" != "$TAG" ]; then
            echo "the tag is $TAG and version.json says $version" >&2
            echo "bump the version with \`pnpm sync:versions\` and tag that commit" >&2
            exit 1
          fi
      - run: pnpm verify:versions

      - name: The release notes exist
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # A release with an empty body is a release nobody can decide about, and the moment to find
        # out is now rather than after six builds have run.
        run: node scripts/release-notes.mjs "$TAG" --check

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_64)
            os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            arch: x64
          - name: Windows (ARM64)
            os: windows-2022
            platform: windows-aarch64
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            arch: arm64
          - name: macOS (Apple silicon)
            os: macos-latest
            platform: darwin-aarch64
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-15-intel
            platform: darwin-x86_64
            target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Linux (x86_64)
            os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - name: Linux (ARM64)
            os: ubuntu-22.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
    env:
      # Job-wide because two steps ask the same question — "is this a signed build?" — and a variable
      # set inside one step is invisible to the next, which is how a release ends up publishing
      # installers and no update channel while every step reports success.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      # The repository's rust-toolchain.toml selects the toolchain Cargo actually runs, and the
      # action's `targets` input installs into the channel it just set as default instead. Ask the
      # pinned toolchain for the target, from inside the repository, so the two cannot drift.
      - name: Add the release target to the pinned toolchain
        shell: bash
        run: rustup target add "${{ matrix.rust_targets }}"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      # WebKit, GTK, and the tooling the RPM bundle is made with.
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm libudev-dev lld

      # The hosted ARM runner has less headroom than the x64 one; the release build and the final
      # link are the two places that notice. The swap file pages the peak to disk instead of letting
      # the runner lose its agent.
      - name: Add swap on the ARM runner
        if: matrix.platform == 'linux-aarch64'
        run: |
          sudo fallocate -l 8G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - run: pnpm install --frozen-lockfile

      # Signing is a secret, so it decides what kind of build this is rather than failing one.
      #
      # The update channel needs the Tauri signing key: without it the build produces installers and
      # no signed update archives, which is a release people can install by hand and not one they are
      # told about. The Apple variables are the platform's own signing and notarization, absent until
      # somebody holds the certificates — the release says so in its own body rather than pretending a
      # warning-free install.
      - name: Build the bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: ${{ matrix.platform == 'linux-aarch64' && '1' || 'default' }}
          RUSTFLAGS: ${{ matrix.platform == 'linux-aarch64' && '-C link-arg=-fuse-ld=lld' || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unfilled secret arrives as an empty string, and an empty string is not "unset" to the
          # tools that read these: signing with nothing is a build that fails in the middle.
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                      APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done

          extra='{}'
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            # The one setting that makes the update archives, switched on here rather than in the
            # configuration: a build without the key must still work, and a checked-in `true` would
            # make every local `pnpm tauri build` demand a secret nobody has.
            extra='{"bundle":{"createUpdaterArtifacts":true}}'
            echo "signing: the update archives will be signed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signing: no update key, so this build publishes no update channel" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "${APPLE_ID:-}" ]; then
            echo "notarization: no Apple credentials, so the macOS build is signed ad hoc at best" >> "$GITHUB_STEP_SUMMARY"
          fi

          # The bundler's last step for macOS builds a DMG by mounting a volume and asking Finder to
          # lay it out, and on a runner neither of those is reliable: it fails with "Resource busy" or
          # with Finder refusing the AppleScript, neither of which is about what is being built, and
          # then succeeds on the next try. So this tries three times, and before each retry detaches
          # the volume a failed attempt left mounted — that leftover mount is what "Resource busy"
          # means. Nothing else is masked: a compile error or a missing file fails three times and the
          # step still fails, with the last attempt's output in the log.
          for attempt in 1 2 3; do
            if pnpm tauri build ${TARGET:+--target "$TARGET"} --config "$extra"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::the build failed three times; the last attempt is what failed"
              exit 1
            fi
            echo "::warning::the build failed (attempt $attempt of 3); clearing up and trying again"
            if [ "$RUNNER_OS" = "macOS" ]; then
              hdiutil detach "/Volumes/7Shell" -force > /dev/null 2>&1 || true
            fi
            sleep 10
          done

      # The platform's own files, and the update manifest's entry for it: which archives exist is read
      # back from what the bundler wrote rather than predicted here.
      - name: Collect the installers
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-artifacts
          # The workspace's own target directory, which is at the repository root rather than under
          # `src-tauri`: this is a Cargo workspace, so every crate's output lands in one place.
          find target -path '*/bundle/*' -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.sig' \) \
            -exec cp {} release-artifacts/ \;

          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            # Named per platform: the six builds' outputs are downloaded into one directory at the
            # end, and a file every job calls the same thing would leave the last platform standing.
            node scripts/update-manifest.mjs platform \
              --bundle target \
              --platform "${{ matrix.platform }}" \
              --tag "$TAG" \
              --repository "${{ github.repository }}" \
              --out "release-artifacts/updater-${{ matrix.platform }}.json"
          fi

          ls -l release-artifacts

      # The two Windows formats Tauri does not make itself: a copy that runs without an installer,
      # and an installer that carries the WebView2 runtime for machines without it. Both are made
      # from the binary the same leg just built, not rebuilt from another checkout.
      - name: Package the Windows portable build and offline installer
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $arch = "${{ matrix.arch }}"
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).app

          # The normal NSIS installer has already been copied into release-artifacts. This second
          # bundle run replaces the file in the target tree with one that embeds WebView2, so the
          # new file is copied out under a name that says which one it is.
          $bundleDir = "target/$target/release/bundle/nsis"
          $before = @{}
          if (Test-Path $bundleDir) {
            Get-ChildItem $bundleDir -Filter "*.exe" | ForEach-Object { $before[$_.FullName] = $_.LastWriteTimeUtc }
          }

          pnpm tauri bundle --bundles nsis --target $target --config src-tauri/tauri.webview2-offline.conf.json

          $offline = Get-ChildItem $bundleDir -Filter "*.exe" |
            Where-Object { !$before.ContainsKey($_.FullName) -or $_.LastWriteTimeUtc -gt $before[$_.FullName] } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (!$offline) {
            throw "Missing WebView2 offline installer in $bundleDir"
          }
          Copy-Item $offline.FullName (Join-Path "release-artifacts" "7Shell_${version}_${arch}-offline-setup.exe") -Force

          $portableDir = Join-Path "portable" "7Shell_${version}_${arch}"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          $binary = "target/$target/release/7Shell.exe"
          if (!(Test-Path $binary)) {
            # The crate's own binary name; the installer renames it to the product name.
            $binary = "target/$target/release/sevenshell-desktop.exe"
          }
          if (!(Test-Path $binary)) {
            throw "Missing Windows executable for $target"
          }
          Copy-Item $binary (Join-Path $portableDir "7Shell.exe") -Force
          Copy-Item "LICENSE" (Join-Path $portableDir "LICENSE") -Force
          Copy-Item "README.md" (Join-Path $portableDir "README.md") -Force
          Copy-Item "README.zh-CN.md" (Join-Path $portableDir "README.zh-CN.md") -Force

          $seed = "target/$target/release/sshell-mcp-seed.exe"
          if (!(Test-Path $seed)) {
            $seed = "src-tauri/binaries/sshell-mcp-seed-$target.exe"
          }
          if (!(Test-Path $seed)) {
            throw "Missing MCP bridge seed for $target"
          }
          Copy-Item $seed (Join-Path $portableDir "sshell-mcp-seed.exe") -Force

          # The marker is what moves the vault, settings and bridge into the copy's own data folder.
          Set-Content -Path (Join-Path $portableDir "portable.7shell") -Value "" -NoNewline
          Set-Content -Path (Join-Path $portableDir "README-portable.txt") -Encoding utf8NoBOM -Value @(
            "7Shell portable build",
            "",
            "Run 7Shell.exe. The vault, settings and MCP bridge are kept in the data folder beside it.",
            "The Microsoft Edge WebView2 runtime is required and is present on Windows 10 and later.",
            "",
            "便携版：运行 7Shell.exe。保险库、设置和 MCP 桥接文件保存在旁边的 data 目录。"
          )

          $zip = Join-Path "release-artifacts" "7Shell_${version}_${arch}-portable.zip"
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $zip -Force

          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            # An explicit empty password keeps the signer from asking a question no runner can answer.
            if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
              pnpm tauri signer sign "--password=" $zip
            } else {
              pnpm tauri signer sign $zip
            }
          }

          ls -l release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-artifacts
          if-no-files-found: error

  # UOS 20 and Kylin V10 are Debian 10 baselines: glibc 2.28, WebKitGTK 4.0 and OpenSSL 1.1.
  # Tauri 2 needs WebKitGTK 4.1, whose oldest practical build base is Debian 12, so these systems
  # get a package that runs the same deb inside APM's Debian 12 environment rather than a second
  # native build. The bridge seed is rebuilt for glibc 2.28 first: an MCP client starts it on the
  # host, not inside the compatibility environment.
  linux-apm:
    name: Package the APM build (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
            platform: linux-x86_64
            base_sha256: a4bdb2988aef2abfc5ec9d7f0665a9e2d07fcc6c10a74b3efe286c5ee796127d
          - os: ubuntu-22.04-arm
            arch: arm64
            platform: linux-aarch64
            base_sha256: 5bedcfb0b28b019a9142be780ffe12945b7104ecb317af68e7a7b8be37c94dd3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The pinned toolchain in rust-toolchain.toml is what Cargo runs; the action only has to put
      # a rustup in place before this script asks for the target.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config perl make

      - name: Install Zig
        run: |
          zig_arch=${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -o /tmp/zig.tar.xz "https://ziglang.org/download/0.17.1/zig-${zig_arch}-linux-0.17.1.tar.xz"
          sudo tar -xf /tmp/zig.tar.xz -C /opt
          sudo ln -sf "/opt/zig-${zig_arch}-linux-0.17.1/zig" /usr/local/bin/zig
          zig version

      - name: Install cargo-zigbuild
        run: |
          python3 -m pip install cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The seed is built here rather than in the Tauri job because it is deliberately not the same
      # binary: static OpenSSL is what lets it run on the host's older OpenSSL while the app runs in
      # the compatibility environment's newer one.
      - name: Build the glibc 2.28 bridge
        run: node scripts/build-legacy-seed.mjs --arch ${{ matrix.arch }} --out legacy-seed/sshell-mcp

      - name: Download the Linux installers
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts

      - name: Install APM and its base environment
        timeout-minutes: 40
        env:
          DEBIAN_FRONTEND: noninteractive
          APM_VERSION: 1.3.4.2
          BASE_VERSION: 12.9.9
          BASE_SHA256: ${{ matrix.base_sha256 }}
        run: |
          set -euo pipefail
          arch=${{ matrix.arch }}
          # The store's CDN closes single connections mid-transfer and throttles them besides.
          # Eight range requests, each resuming its own chunk and bounded by --max-time, are what
          # make a 500 MB base fit in a job. The pinned hash still decides whether the assembled
          # file is the whole package.
          fetch() {
            url=$1
            output=$2
            for attempt in 1 2 3 4 5; do
              if curl --http1.1 --fail --location --retry 3 --retry-all-errors --silent --show-error \
                --connect-timeout 30 --max-time 600 --continue-at - --output "$output" "$url"; then
                return 0
              fi
              echo "download attempt ${attempt} failed; resuming" >&2
              sleep 3
            done
            return 1
          }
          fetch \
            "https://gitee.com/amber-ce/amber-pm/releases/download/${APM_VERSION}/apm_${APM_VERSION}_${arch}.deb" \
            /tmp/apm.deb
          sudo apt-get install -y /tmp/apm.deb

          base_url="https://d.spark-app.store/${arch}-apm/depends/base-bookworm/amber-pm-bookworm_${BASE_VERSION}_${arch}.deb"
          total=$(curl --http1.1 --location --silent --show-error --head "$base_url" |
            awk 'tolower($1) == "content-length:" { print $2 }' | tr -d '\r')
          test -n "$total"
          test "$total" -gt 0
          chunks=8
          chunk=$(((total + chunks - 1) / chunks))
          rm -rf /tmp/base-chunks
          mkdir -p /tmp/base-chunks
          for i in $(seq 0 $((chunks - 1))); do
            start=$((i * chunk))
            end=$((start + chunk - 1))
            if [ "$end" -ge "$total" ]; then end=$((total - 1)); fi
            (
              file=/tmp/base-chunks/$i
              expected=$((end - start + 1))
              for attempt in $(seq 1 30); do
                have=$(stat -c%s "$file" 2>/dev/null || echo 0)
                if [ "$have" -gt "$expected" ]; then rm -f "$file"; have=0; fi
                if [ "$have" -eq "$expected" ]; then exit 0; fi
                curl --http1.1 --fail --silent --show-error --connect-timeout 30 --max-time 900 \
                  -r "$((start + have))-$end" "$base_url" >> "$file" || sleep 2
              done
              exit 1
            ) &
          done
          wait
          for i in $(seq 0 $((chunks - 1))); do
            start=$((i * chunk))
            end=$((start + chunk - 1))
            if [ "$end" -ge "$total" ]; then end=$((total - 1)); fi
            expected=$((end - start + 1))
            have=$(stat -c%s "/tmp/base-chunks/$i" 2>/dev/null || echo 0)
            if [ "$have" -ne "$expected" ]; then
              echo "base chunk $i is $have bytes, expected $expected" >&2
              exit 1
            fi
          done
          cat /tmp/base-chunks/* > /tmp/base.deb
          ls -l /tmp/base.deb
          echo "${BASE_SHA256}  /tmp/base.deb" | sha256sum --check
          sudo apt-get install -y /tmp/base.deb
          if [ ! -e /dev/fuse ]; then
            echo "the runner has no /dev/fuse; amber-pm-convert cannot mount its overlay" >&2
            exit 1
          fi
          bwrap --version

      - name: Convert the deb to an APM package
        run: |
          version=$(node -p "require('./version.json').app")
          deb=$(find artifacts -maxdepth 1 -name "7Shell_*_${{ matrix.arch }}.deb" -print -quit)
          test -n "$deb"
          sudo env "PATH=$PATH" node scripts/package-apm.mjs \
            --deb "$(realpath "$deb")" \
            --seed "$(realpath legacy-seed/sshell-mcp)" \
            --version "$version" \
            --out "$(realpath -m dist-apm)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-apm-${{ matrix.arch }}
          path: dist-apm
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [build, linux-apm]
    runs-on: ubuntu-latest
    permissions:
      # The release, its assets and the update channel's own release are all written with the token
      # this job is given. Nothing else in the repository needs write access.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # What the release carries: the installers a person runs, and the archives the update channel
      # downloads. On Windows those are the same files — the signature is attached to the installer —
      # and on macOS and Linux the update artifact is the packed application or the AppImage itself.
      # Both kinds are named here by file name because the update manifest does the same: an archive
      # that is not attached is an update that cannot be fetched.
      - name: Choose the assets
        shell: bash
        run: |
          # `|| true` on each `ls`, and not because the output does not matter: a glob that matches
          # nothing makes `ls` exit 2, the step runs under `-e -o pipefail`, and a release with no
          # signing key has no `*.app.tar.gz` — which is exactly how this step failed the first time
          # it ever ran. What is missing is reported by the step after this one, which refuses an
          # empty directory by name rather than by exit code.
          mkdir -p release
          {
            ls artifacts/*.msi artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb artifacts/*.rpm 2>/dev/null || true
            ls artifacts/*.app.tar.gz artifacts/*.AppImage.tar.gz 2>/dev/null || true
            ls artifacts/*-portable.zip artifacts/*-portable.zip.sig 2>/dev/null || true
          } | sort -u > release-assets.txt
          while read -r file; do cp "$file" release/; done < release-assets.txt
          ls -l release

      - name: Hash what was actually built
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The chosen files rather than everything the builds produced: the hashes published in the
          # notes and in the package manager manifests are of the downloads, and a table that also
          # listed a job's own bookkeeping files would invite somebody to check the wrong one.
          node scripts/packaging-manifests.mjs assets \
            --dir release --tag "$TAG" --repository "${{ github.repository }}" --out assets.json
          node -e "for (const a of require('./assets.json')) console.log(a.sha256 + '  ' + a.name)"

      - name: Write the update manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if compgen -G "artifacts/updater-*.json" > /dev/null; then
            mkdir -p updater
            cp artifacts/updater-*.json updater/
            node scripts/release-notes.mjs "$TAG" > release-body.md
            node scripts/update-manifest.mjs merge \
              --releases updater \
              --version "${TAG#v}" \
              --tag "$TAG" \
              --repository "${{ github.repository }}" \
              --notes release-body.md \
              --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --out latest.json
            # Attached to this release like everything else, and picked up by the promotion step when
            # a person decides the build is good. A candidate is not offered to installed builds.
            echo "signing: this release carries a signed update manifest" >> "$GITHUB_STEP_SUMMARY"
          else
            # No signing key: the release still ships, and it ships without an update manifest rather
            # than with one pointing at files nobody signed. The promotion step notices the absence
            # and leaves the channel as it is.
            echo "signing: no update key, so this release carries no update manifest" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write the package manager manifests
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/packaging-manifests.mjs manifests \
            --assets assets.json --version "${TAG#v}" --tag "$TAG" \
            --repository "${{ github.repository }}" --date "$(date -u +%Y-%m-%d)" \
            --out packaging/out
          find packaging/out -type f | sort || true
          (cd packaging/out && zip -qr "$GITHUB_WORKSPACE/packaging-manifests.zip" .)

      - name: The release body
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            node scripts/release-notes.mjs "$TAG"
            echo ""
            echo "---"
            echo ""
            echo "### Files and checksums"
            echo ""
            echo '```'
            # From the files themselves rather than from a table somebody typed: these lines are the
            # hashes of what is attached below.
            (cd release && sha256sum $(cat ../release-assets.txt | xargs -n1 basename)) || true
            echo '```'
            echo ""
            echo "### Installing"
            echo ""
            echo "- **Windows:** run the \`.exe\` or \`.msi\`. The installer is not code-signed yet, so Windows warns before running it. The \`-offline-setup.exe\` carries the WebView2 runtime; the \`-portable.zip\` keeps its vault and settings in a \`data\` folder beside the executable."
            echo "- **macOS:** open the \`.dmg\` and drag the application across. The build is not notarized yet, so Gatekeeper warns."
            echo "- **Linux:** the AppImage runs after \`chmod +x\`; the \`.deb\` and \`.rpm\` install with the system's package manager. These need glibc 2.35 or newer and WebKitGTK 4.1."
            echo "- **UOS 20 / Kylin V10 (glibc 2.28):** install APM first, then \`sudo apt install ./7Shell_<version>_<arch>-apm.deb\`. It runs the same application inside APM's Debian 12 environment; the bridge the MCP client starts is built for the host's glibc."
            echo ""
            echo "Package manager manifests for Winget, Scoop and Homebrew are attached as \`packaging-manifests.zip\`."
            echo ""
            echo "Nothing in this project has had a security review. Read SECURITY.md before putting production credentials in it."
          } > body.md
          cat body.md

      - name: Attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Everything that is attached, and only those: the installers, the update manifest, the
          # hash list and the package manager manifests.
          files="$(cat release-assets.txt) assets.json packaging-manifests.zip"
          if [ -f latest.json ]; then files="$files latest.json"; fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-running a release is normal — a build failed, a note was wrong — so an existing
            # release is filled in rather than treated as an error.
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file body.md
          else
            # As a draft: it exists while the next step runs and is not on the releases page until
            # everything is attached, so nobody opens a release that is still being filled.
            gh release create "$TAG" --draft --title "$TAG" --notes-file body.md $files
          fi

      - name: Publish it as a candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Every release goes out marked as a prerelease, and somebody promotes it when they are
          # satisfied — with the `promote` input of this workflow, or by hand:
          #   gh release edit <tag> --prerelease=false --latest
          # That is what "candidate" means here. It is deliberately not a suffix on the version: a
          # suffixed version cannot be built as an MSI at all, and the package managers take releases.
          #
          # Asked once, into a variable, so a `gh` that cannot answer fails the step instead of being
          # read as "not a draft" and reported as a release somebody had already published.
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
            echo "**$TAG is published as a candidate.** Installed builds are not offered it until it is promoted." >> "$GITHUB_STEP_SUMMARY"
          else
            # Re-running a release that is already out there: its flags are somebody's decision about
            # it, and a build job has no business changing them back.
            echo "**$TAG is already published**; its files were replaced and its flags were left alone." >> "$GITHUB_STEP_SUMMARY"
          fi

  promote:
    name: Promote a release
    # The other half of "candidate": the release already exists, its files were built and signed by
    # the run that made it, and this only says that a person considers it good. It is also the moment
    # the update channel starts offering it — a channel that offered candidates would be a channel
    # whose users are the ones who find out that a build was not ready.
    if: ${{ inputs.promote }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote it, and point the update channel at it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" --prerelease=false --latest

          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx latest.json; then
            gh release download "$TAG" --pattern latest.json --clobber
            # The channel is its own tiny release whose one asset is replaced: the endpoint the
            # application reads is a fixed URL, and a URL that changed with every version would be a
            # URL baked into the builds people already have.
            if ! gh release view updates > /dev/null 2>&1; then
              gh release create updates \
                --title "Update channel" \
                --prerelease \
                --notes "The signed update manifest the installed application reads. It is replaced when a release is promoted, and it is not a release of its own."
            fi
            gh release upload updates latest.json --clobber
            echo "**$TAG is the latest release**, and the update channel now offers it." >> "$GITHUB_STEP_SUMMARY"
          else
            # No signing key when that release was built: there is nothing for the channel to point
            # at, and a manifest for an unsigned artefact is worse than none.
            echo "::warning::$TAG carries no latest.json, so the update channel was left as it was."
          fi
