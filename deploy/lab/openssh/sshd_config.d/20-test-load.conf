# The lab is a fixture, and these settings are what a fixture needs to be one.
#
# OpenSSH 9.8 and later penalise a source address that opens connections too quickly or fails to
# authenticate against it, and every connection in the live suite comes from one address — the
# machine running the tests. The penalty is right for a server on the internet and wrong here:
# without this line a full run ends with the last tests being disconnected before they can
# authenticate, which reads as an unreachable server rather than as the fixture refusing company.
#
# The ceiling is raised for the same reason. The default is ten unauthenticated connections; the
# batch tests open four at once and retry, and the monitor, file and forward tests add their own
# behind them.
PerSourcePenalties no
MaxStartups 100:30:200
