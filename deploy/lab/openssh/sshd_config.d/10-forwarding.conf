# The image ships with `AllowTcpForwarding no`, which is a sensible default and useless in a lab
# whose whole purpose is testing a jump host and a tunnel.
#
# sshd uses the first value it obtains for a setting, and this file is included at the top of the
# configuration, so it wins over the line further down.
AllowTcpForwarding yes
AllowAgentForwarding yes
