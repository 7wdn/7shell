schemaVersion: 1

# The vocabulary shared by protocols and auth methods. Adding a capability here is
# only half the work: it must also be claimed by at least one descriptor before it
# means anything, and its labelKey must exist in every locale.
capabilities:
  - key: shell
    order: 10
    group: terminal
    labelKey: capability.shell.label

  - key: exec
    order: 20
    group: terminal
    labelKey: capability.exec.label

  - key: resize
    order: 30
    group: terminal
    labelKey: capability.resize.label

  - key: keepalive
    order: 40
    group: session
    labelKey: capability.keepalive.label

  # What the host monitor reads: a sample of the far side's load, memory, interfaces and mounts,
  # taken by running commands over the connection. A capability rather than a separate feature
  # because it is exactly the question this vocabulary asks — can this protocol, over this build,
  # tell the interface what the machine is doing?
  - key: hostMetrics
    order: 45
    group: session
    labelKey: capability.hostMetrics.label

  - key: sftp
    order: 50
    group: transfer
    labelKey: capability.sftp.label

  # A file browser over an HTTP folder rather than an SSH channel. Its own capability because the
  # two protocols share the panel but not the operations: WebDAV has no permission bits, no
  # remote `tar`, and moves are the server's COPY/MOVE rather than an SFTP channel.
  - key: webdav
    order: 55
    group: transfer
    labelKey: capability.webdav.label

  # The other HTTP-adjacent file protocol, and a different shape again: a stateful control
  # connection, a data connection per transfer, and no permission bits to read back.
  - key: ftp
    order: 57
    group: transfer
    labelKey: capability.ftp.label

  # Not a protocol of its own: the fallback an SSH session takes when the server has no SFTP
  # subsystem. It is a capability because it changes what the file browser can do, not the session.
  - key: scp
    order: 58
    group: transfer
    labelKey: capability.scp.label

  - key: forwarding
    order: 60
    group: network
    labelKey: capability.forwarding.label

  - key: dynamicForwarding
    order: 70
    group: network
    labelKey: capability.dynamicForwarding.label

  - key: agentForwarding
    order: 80
    group: network
    labelKey: capability.agentForwarding.label
    # Implemented — the request goes on the session channel and the reverse channel is bridged to
    # this machine's agent — but not claimed yet. What is missing is proof of the *far side using
    # it*: `crates/sevenshell-ssh/tests/live_agent_forwarding.rs` runs that end to end and has not
    # been able to, on the machines this was built on, because neither agent there is one this build
    # can reach. Run it where an agent is running (the test starts the server side itself), then
    # drop this flag and claim the capability on the SSH descriptor.
    planned: true

  - key: jumpHost
    order: 90
    group: network
    labelKey: capability.jumpHost.label

  - key: recording
    order: 100
    group: session
    labelKey: capability.recording.label

  - key: secret
    order: 110
    group: auth
    labelKey: capability.secret.label

  - key: interactive
    order: 120
    group: auth
    labelKey: capability.interactive.label

  - key: keyMaterial
    order: 130
    group: auth
    labelKey: capability.keyMaterial.label

  - key: platformAgent
    order: 140
    group: auth
    labelKey: capability.platformAgent.label

  - key: systemClient
    order: 145
    group: desktop
    labelKey: capability.systemClient.label

  - key: desktopView
    order: 150
    group: desktop
    labelKey: capability.desktopView.label
    # Registered for the in-process engine that this build no longer carries. The vocabulary stays
    # so a future build can claim it; nothing here pretends the desktop is drawn by this process.
    planned: true

  - key: desktopInput
    order: 160
    group: desktop
    labelKey: capability.desktopInput.label
    planned: true

  - key: desktopResize
    order: 170
    group: desktop
    labelKey: capability.desktopResize.label
    planned: true

  - key: desktopClipboard
    order: 180
    group: desktop
    labelKey: capability.desktopClipboard.label
    # The system client shares the clipboard; this build does not implement the channel itself.
    planned: true

  # -- Containers ---------------------------------------------------------
  # The vocabulary is registered before the code lands: a capability is claimed by the change that
  # implements and tests it, and every one below is planned until then.

  - key: container
    order: 190
    group: container
    labelKey: capability.container.label
    planned: true

  - key: containerImages
    order: 200
    group: container
    labelKey: capability.containerImages.label
    planned: true

  - key: containerLogs
    order: 210
    group: container
    labelKey: capability.containerLogs.label
    planned: true

  - key: containerExec
    order: 220
    group: container
    labelKey: capability.containerExec.label
    planned: true

  - key: containerFiles
    order: 230
    group: container
    labelKey: capability.containerFiles.label
    planned: true

  # -- Kubernetes ---------------------------------------------------------

  - key: kubernetes
    order: 240
    group: container
    labelKey: capability.kubernetes.label
    planned: true

  - key: kubernetesLogs
    order: 250
    group: container
    labelKey: capability.kubernetesLogs.label
    planned: true

  - key: kubernetesExec
    order: 260
    group: container
    labelKey: capability.kubernetesExec.label
    planned: true

  - key: kubernetesMetrics
    order: 270
    group: container
    labelKey: capability.kubernetesMetrics.label
    planned: true

  - key: kubernetesTunnel
    order: 280
    group: container
    labelKey: capability.kubernetesTunnel.label
    # Reaching an API server through a saved SSH session. The transport exists; the wiring is
    # planned.
    planned: true
