[package]
name = "sevenshell-mcp"
description = "The stdio bridge an MCP client starts: it speaks the protocol on stdin and stdout and calls the desktop's control endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sevenshell_mcp"
path = "src/lib.rs"

[[bin]]
name = "sshell-mcp"
path = "src/main.rs"

[features]
# The UOS/Kylin compatibility package starts this bridge on the host, whose OpenSSL can be older
# than the one the desktop bundles. `vendored` compiles OpenSSL into the binary, so the seed only
# needs the host's glibc; the ordinary Linux seed keeps using the system's own TLS stack.
vendored-tls = ["dep:native-tls", "native-tls/vendored"]

[dependencies]
sevenshell-api = { workspace = true }
# The same configuration directory the desktop writes the endpoint into. Resolving it a second way
# would be a second answer to "where does this installation keep its files".
sevenshell-platform = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
# Optional so the dependency exists only for `vendored-tls`; the crate never names it directly.
native-tls = { version = "0.2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
# A call id for every tools/call: unique across sessions, so a cancellation names one call even
# after the bridge that minted it is gone.
uuid = { workspace = true }

[dev-dependencies]
sevenshell-error = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
