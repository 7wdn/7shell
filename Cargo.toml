[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

log = "0.4"

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-log = "2"

sevenshell-error = { version = "0.1.0", path = "crates/sevenshell-error" }
sevenshell-platform = { version = "0.1.0", path = "crates/sevenshell-platform" }
sevenshell-types = { version = "0.1.0", path = "crates/sevenshell-types" }

[profile.dev.package."*"]
# Dependencies are never breakpoint-inspected in dev; line tables keep backtraces
# resolvable while shrinking build time and artifacts.
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
