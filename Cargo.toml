[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

log = "0.4"
base64 = "0.23"
# Reading the file list off the clipboard is a Windows API rather than a portable one; the
# alternative is telling Windows users that pasting files is not supported.
clipboard-win = { version = "5.4", features = ["std"] }
# Whether Windows itself is in its light or dark appearance. The shell has to read it: inside a
# WebView2 the media query that would answer this reports light whatever the system is, so an
# interface following the system would be following a lie.
winreg = "0.55"
# The families a machine has, for the interface font and the terminal font. A system source rather
# than a reader of the font files: the names have to come back spelled the way this machine spells
# them, which on a Chinese installation means 微软雅黑 rather than Microsoft YaHei — a name table
# carries both and the choice between them is the platform's.
font-kit = "0.14"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.3"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0"
# Packing and unpacking on *this* side of a packed transfer. The far side's own `tar` makes the
# archive that crosses the wire; these make or open the one this machine has to deal with, which is
# what lets a packed upload start from ordinary files rather than from an archive somebody made by
# hand. `flate2` is already in the tree through russh's compression feature.
tar = "0.4"
flate2 = "1"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "fs",
] }
uuid = { version = "1.26", features = ["v4", "serde"] }
zeroize = { version = "1.9", features = ["derive"] }
tempfile = "3"

# Talking to a server that is not an SSH host: the sync service, and the snippet hosts later.
#
# The platform's own TLS stack rather than a bundled one: Schannel on Windows, Security.framework on
# macOS, OpenSSL on Linux. Three reasons in order of weight. It trusts what the machine already
# trusts, so an internal certificate authority works without this project shipping a copy of
# anybody's root list — and nothing here has to be added to the licence allow-list to get it. It is
# the stack the rest of the system uses, which is what makes a machine that can reach a server with
# its browser able to reach it here. And it leaves out `aws-lc-rs`, which would put a C toolchain in
# every build.
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls",
  "charset",
  "http2",
  "system-proxy",
] }

tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# The update channel: reading the signed update metadata and installing what it names. The endpoint
# and the public key live in the bundle configuration, so a build with no key still compiles and
# still runs — it just has nothing to verify an update against, and says so.
tauri-plugin-updater = "2"
# One application per machine: a second launch hands its request to the one already running rather
# than starting a shell of its own — two shells would mean two trays, two vaults on one file and two
# sets of live sessions against the same servers.
tauri-plugin-single-instance = "2"

sevenshell-error = { version = "0.1.2", path = "crates/sevenshell-error" }
sevenshell-platform = { version = "0.1.2", path = "crates/sevenshell-platform" }
sevenshell-policy = { version = "0.1.2", path = "crates/sevenshell-policy" }
sevenshell-vault = { version = "0.1.2", path = "crates/sevenshell-vault" }
sevenshell-core = { version = "0.1.2", path = "crates/sevenshell-core" }
sevenshell-ssh = { version = "0.1.2", path = "crates/sevenshell-ssh" }
sevenshell-sync = { version = "0.1.2", path = "crates/sevenshell-sync" }
sevenshell-session = { version = "0.1.2", path = "crates/sevenshell-session" }
sevenshell-sftp = { version = "0.1.2", path = "crates/sevenshell-sftp" }
sevenshell-types = { version = "0.1.2", path = "crates/sevenshell-types" }

[profile.dev]
# Line tables for everything in dev, this workspace's own crates included. What is actually read
# out of a debug build is the `file:line` a backtrace names; full debug info buys locals and
# expression evaluation at a multiple of the size of every artifact and every incremental session.
# That multiple is not incidental here: the whole application is one crate (the `sevenshell-desktop`
# lib, Tauri and all), so full debug info made one incremental session ~1.3 GB, the static library
# 1.05 GB, and `target/debug` passed 60 GB in ten days. The rule this replaces only covered
# dependencies, which left the expensive half untouched. Set `CARGO_PROFILE_DEV_DEBUG=2` for a
# session that needs to step through Rust with locals.
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
