# Dependency policy, checked by cargo-deny in CI.
#
# The point of an allow-list rather than a deny-list: a new licence has to be looked at and
# added deliberately, instead of arriving unnoticed inside a transitive dependency.

[graph]
all-features = false

[licenses]
# Licences compatible with shipping this project under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # The root certificates Mozilla ships, as data (`webpki-root-certs`). Permissive, no copyleft, no
  # obligation beyond carrying the notice — and it is the same certificate store every TLS client on
  # the machine trusts anyway.
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Ask a human when a licence text is only matched by guesswork.
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Nothing may depend on a crate that is not on crates.io. A git dependency is how a
# project ends up carrying someone else's fork, its URL and its licence obligations.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Act on advisories that affect this workspace's own crates. A transitive dependency of
# Tauri (proc-macro-error, for instance) cannot be fixed from here, and a report nobody
# can act on is noise that gets ignored — the licence and source rules below are where
# this project can actually hold the line.
unmaintained = "workspace"
# A yanked crate in the lockfile means the version we pinned was withdrawn; fail so it gets
# looked at, rather than shipping something its author pulled.
yanked = "deny"
# Something that is wrong *for this project* belongs here with a comment saying why,
# rather than being added quietly.
ignore = [
  # The Marvin attack against RSA, as `russh` uses it. There is no release to move to: the advisory
  # is against the `rsa` crate itself, which states the timing leak is inherent to what it does, and
  # the alternative is not doing RSA keys at all — which for an SSH client means not connecting to a
  # good part of the machines it exists for. Nothing this repository changes can fix it, and a report
  # nobody can act on is what the setting above is about too.
  "RUSTSEC-2023-0071",
]
