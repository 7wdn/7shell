[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

log = "0.4"
base64 = "0.23"
# Reading the file list off the clipboard is a Windows API rather than a portable one; the
# alternative is telling Windows users that pasting files is not supported.
clipboard-win = { version = "5.4", features = ["std"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.3"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0"
# Packing and unpacking on *this* side of a packed transfer. The far side's own `tar` makes the
# archive that crosses the wire; these make or open the one this machine has to deal with, which is
# what lets a packed upload start from ordinary files rather than from an archive somebody made by
# hand. `flate2` is already in the tree through russh's compression feature.
tar = "0.4"
flate2 = "1"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "fs",
] }
uuid = { version = "1.26", features = ["v4", "serde"] }
zeroize = { version = "1.9", features = ["derive"] }
tempfile = "3"

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

sevenshell-error = { version = "0.1.0", path = "crates/sevenshell-error" }
sevenshell-platform = { version = "0.1.0", path = "crates/sevenshell-platform" }
sevenshell-policy = { version = "0.1.0", path = "crates/sevenshell-policy" }
sevenshell-vault = { version = "0.1.0", path = "crates/sevenshell-vault" }
sevenshell-core = { version = "0.1.0", path = "crates/sevenshell-core" }
sevenshell-ssh = { version = "0.1.0", path = "crates/sevenshell-ssh" }
sevenshell-session = { version = "0.1.0", path = "crates/sevenshell-session" }
sevenshell-sftp = { version = "0.1.0", path = "crates/sevenshell-sftp" }
sevenshell-types = { version = "0.1.0", path = "crates/sevenshell-types" }

[profile.dev.package."*"]
# Dependencies are never breakpoint-inspected in dev; line tables keep backtraces
# resolvable while shrinking build time and artifacts.
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
