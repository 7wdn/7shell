[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

log = "0.4"
base64 = "0.23"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.3"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "fs",
] }
uuid = { version = "1.26", features = ["v4", "serde"] }
zeroize = { version = "1.9", features = ["derive"] }
tempfile = "3"

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

sevenshell-error = { version = "0.1.0", path = "crates/sevenshell-error" }
sevenshell-platform = { version = "0.1.0", path = "crates/sevenshell-platform" }
sevenshell-vault = { version = "0.1.0", path = "crates/sevenshell-vault" }
sevenshell-core = { version = "0.1.0", path = "crates/sevenshell-core" }
sevenshell-ssh = { version = "0.1.0", path = "crates/sevenshell-ssh" }
sevenshell-session = { version = "0.1.0", path = "crates/sevenshell-session" }
sevenshell-types = { version = "0.1.0", path = "crates/sevenshell-types" }

[profile.dev.package."*"]
# Dependencies are never breakpoint-inspected in dev; line tables keep backtraces
# resolvable while shrinking build time and artifacts.
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
